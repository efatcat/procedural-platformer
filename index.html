<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пятиугольный путь</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <h1>Пятиугольный путь</h1>
        <p>Доберись до финиша через 40 платформ</p>
      </div>
      <div class="stats"><span id="progress">Платформа 1 / 40</span><span id="seed"></span></div>
    </header>
    <div class="canvas-wrap">
      <canvas id="game" width="960" height="540" aria-label="Платформер"></canvas>
      <div id="message" class="message hidden"></div>
    </div>
    <footer><b>← → / A D</b> — движение &nbsp; <b>↑ / W / Space</b> — прыжок &nbsp; <b>R</b> — заново</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
